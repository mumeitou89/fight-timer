<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>リングタイマー</title>
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="apple-mobile-web-app-title" content="リングタイマー">
<meta name="theme-color" content="#000000">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="stylesheet" href="style.css">
</head>
<body>

<div id="app" class="ph-idle">
  <div class="head">
    <button id="btnSettings" class="chip">設定</button>
    <div class="headmid">
      <span id="phase" class="tint">READY</span>
      <span id="roundSeg" class="seg small tint"></span>
    </div>
    <div class="spacer"></div>
  </div>

  <div class="main">
    <div id="timeSeg" class="seg big tint"></div>
  </div>

  <div class="foot">
    <div id="info" class="info"></div>
    <div class="controls">
      <button id="btnReset" class="btn sub">リセット</button>
      <button id="btnStart" class="btn primary">スタート</button>
    </div>
  </div>
</div>

<div id="sheet" class="sheet" hidden>
  <div class="sheet-head">
    <div class="sheet-title">設定</div>
    <button id="btnClose" class="chip">閉じる</button>
  </div>
  <div id="sheetBody" class="sheet-body"></div>
</div>

<script src="app.js"></script>
</body>
</html>
